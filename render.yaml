# Optional: Render.com blueprint. Same backend, different host.
services:
  - type: web
    name: tictactoe-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT tictactoe.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: tictactoe-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: tictactoe-db
    plan: free
